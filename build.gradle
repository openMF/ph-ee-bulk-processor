plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.diffplug.spotless' version '6.19.0'
}
// The com.jfrog.artifactory plugin ('5.+') was removed: deploy strategy is
// being reworked ecosystem-wide; maven-publish stays for local publishing.
repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2')
    }

    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }

    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }

    // Mifos Platform BOM + ph-ee-connector-common 2.0.0-SNAPSHOT are consumed
    // from the local JFrog Artifactory sandbox (Docker Compose in
    // proposal/local-jfrog/). Swap this host for the production Mifos JFrog
    // when the official BOM is ready.
    maven {
        name = 'LocalJFrog'
        url = uri('http://localhost:8081/artifactory/mifos-platform-snapshot')
        allowInsecureProtocol = true
        credentials {
            username = findProperty('localJfrog.user') ?: System.getenv('LOCAL_JFROG_USER')
            password = findProperty('localJfrog.key') ?: System.getenv('LOCAL_JFROG_KEY')
        }
    }
}

apply plugin:'com.diffplug.spotless'
spotless {
    format 'misc', {
        target '**/*.md', '**/*.properties', '**/.gitignore', '**/.openapi-generator-ignore', '**/*.yml', '**/*.xml', '**/**.json', '**/*.sql'
        targetExclude '**/build/**', '**/bin/**', '**/.settings/**', '**/.idea/**', '**/.gradle/**', '**/gradlew.bat', '**/licenses/**', '**/banner.txt', '.vscode/**'
        indentWithSpaces(4)
        endWithNewline()
        trimTrailingWhitespace()
    }

    groovyGradle {
        target '*.gradle', '**/*.gradle'
        targetExclude '**/build/**'
        greclipse()
        indentWithSpaces(4)
        endWithNewline()
        trimTrailingWhitespace()
    }
    lineEndings 'UNIX'
}

ext {
    cucumberVersion = '7.8.1'
}

dependencies {
    // Mifos Platform BOM pins Spring Boot 3.4, Camel 4, Zeebe 8, Jakarta EE 10
    // and every other shared library version. Do NOT hardcode managed versions.
    // This is a deployable application (leaf node), so use enforcedPlatform().
    implementation enforcedPlatform('org.mifos.platform:mifos-platform-bom:1.0.0-SNAPSHOT')

    // spring dependency
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // spring test dependency
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // camel dependency
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel:camel-undertow'
    implementation 'org.apache.camel:camel-http'
    implementation 'org.apache.camel.springboot:camel-mail-starter'
    implementation 'org.apache.camel:camel-jackson'

    // camel test dependency (camel-test was the JUnit4 module; Camel 4 ships
    // camel-test-junit5 instead)
    testImplementation 'org.apache.camel:camel-test-junit5'
    testImplementation 'org.apache.camel:camel-test-spring-junit5'

    // cucumber test dependency
    testImplementation "io.cucumber:cucumber-junit:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-spring:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-java:$cucumberVersion"

    // miscellaneous dependency
    implementation 'com.google.code.gson:gson'
    implementation 'org.json:json'
    implementation 'org.mifos:ph-ee-connector-common:2.0.0-SNAPSHOT'
    // AWS SDK v1 is actually used by the storage code. The v1 -> v2 migration
    // is a code rewrite (different packages), out of scope for this PR.
    implementation 'com.amazonaws:aws-java-sdk:1.11.486'
    implementation 'commons-io:commons-io'

    implementation 'com.amazonaws:aws-java-sdk-s3:1.11.486'
    //To be removed
    implementation 'com.amazonaws:aws-java-sdk-dynamodb:1.11.486'
    implementation 'com.azure:azure-storage-blob'

    implementation 'io.camunda:zeebe-client-java'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
    implementation 'org.apache.tika:tika-core:1.4'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    checkstyle 'com.puppycrawl.tools:checkstyle:10.9.3'
    checkstyle 'com.github.sevntu-checkstyle:sevntu-checks:1.44.1'

    // miscellaneous test dependency
    testImplementation "com.google.truth:truth:1.1.3"
    implementation 'io.rest-assured:rest-assured'

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.9.0'
    implementation('com.squareup.retrofit2:converter-gson:2.9.0')
}

configure(this) {
    // NOTE: order matters!
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'eclipse'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    configurations {
        implementation.setCanBeResolved(true)
        api.setCanBeResolved(true)
    }
    tasks.withType(JavaCompile) {
        options.compilerArgs += [
            "-Xlint:unchecked",
            "-Xlint:cast",
            "-Xlint:auxiliaryclass",
            "-Xlint:deprecation",
            "-Xlint:dep-ann",
            "-Xlint:divzero",
            "-Xlint:empty",
            "-Xlint:exports",
            "-Xlint:fallthrough",
            "-Xlint:finally",
            "-Xlint:module",
            "-Xlint:opens",
            "-Xlint:options",
            "-Xlint:overloads",
            "-Xlint:overrides",
            "-Xlint:path",
            "-Xlint:processing",
            "-Xlint:removal",
            "-Xlint:requires-automatic",
            "-Xlint:requires-transitive-automatic",
            "-Xlint:try",
            "-Xlint:varargs",
            "-Xlint:preview",
            "-Xlint:static",
            // -Werror needs to be disabled because EclipseLink's static weaving doesn't generate warning-free code
            // and during an IntelliJ recompilation, it fails
            //"-Werror",
            "-Xmaxwarns",
            1500,
            "-Xmaxerrs",
            1500
        ]
        options.deprecation = true
    }
    // Configuration for the spotless plugin
    // https://github.com/diffplug/spotless/tree/main/plugin-gradle
    spotless {
        java {
            targetExclude '**/build/**', '**/bin/**', '**/out/**'
            importOrder() //sort imports alphabetically
            removeUnusedImports()
            eclipse().configFile "$rootDir/config/bulk-formatter.xml"
            endWithNewline()
            trimTrailingWhitespace()
            // Enforce style modifier order
            custom 'Modifier ordering', {
                def modifierRanking = [
                    public      : 1,
                    protected   : 2,
                    private     : 3,
                    abstract    : 4,
                    default     : 5,
                    static      : 6,
                    final       : 7,
                    transient   : 8,
                    volatile    : 9,
                    synchronized: 10,
                    native      : 11,
                    strictfp    : 12]
                // Find any instance of multiple modifiers. Lead with a non-word character to avoid
                // accidental matching against for instance, "an alternative default value"
                it.replaceAll(/\W(?:public |protected |private |abstract |default |static |final |transient |volatile |synchronized |native |strictfp ){2,}/, {
                    // Do not replace the leading non-word character.  Identify the modifiers
                    it.replaceAll(/(?:public |protected |private |abstract |default |static |final |transient |volatile |synchronized |native |strictfp ){2,}/, {
                        // Sort the modifiers according to the ranking above
                        it.split().sort({ modifierRanking[it] }).join(' ') + ' '
                    }
                    )
                }
                )
            }
        }
        lineEndings 'UNIX'
    }
    // If we are running Gradle within Eclipse to enhance classes,
    // set the classes directory to point to Eclipse's default build directory
    if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
        sourceSets.main.java.outputDir = file("$projectDir/bin/main")
    }
    // Configuration for the Checkstyle plugin
    // https://docs.gradle.org/current/userguide/checkstyle_plugin.html
    dependencies {
        checkstyle 'com.puppycrawl.tools:checkstyle:10.3.1'
        checkstyle 'com.github.sevntu-checkstyle:sevntu-checks:1.42.0'
    }
}


group = 'org.mifos'
version = '2.0.0.mifos-SNAPSHOT'
description = 'ph-ee-processor-bulk'
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}



